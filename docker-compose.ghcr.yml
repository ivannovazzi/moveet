# Run the full Moveet stack from published images (no build required).
# Usage: docker compose -f docker-compose.ghcr.yml up
#
# Road networks live in the simulator's map library on the `maps` named volume
# (GET /maps, POST /maps/:id/activate); new maps are built at runtime with
# POST /maps (ALLOW_MAP_BUILDS, on by default). An empty library starts on a small
# bundled demo map. To import a network generated with
# `npx tsx apps/network/src/cli.ts prepare <region>` into a fresh library,
# uncomment the import mount below; the host file must exist first, or Docker
# creates an empty directory in its place.
services:
  simulator:
    image: ghcr.io/ivannovazzi/moveet-simulator:latest
    ports:
      - "5010:3000"
    environment:
      - PORT=3000
      - UPDATE_INTERVAL=300
      - USE_ADAPTER=true
      - ADAPTER_URL=http://adapter:5011
      - MAPS_DIR=/data/maps
    volumes:
      - maps:/data/maps
      # - ./apps/simulator/data/network.geojson:/repo/apps/simulator/data/network.geojson:ro

  adapter:
    image: ghcr.io/ivannovazzi/moveet-adapter:latest
    ports:
      - "5011:5011"
    environment:
      - PORT=5011
      - SOURCE_TYPE=static
      - SINK_TYPES=console

  ui:
    image: ghcr.io/ivannovazzi/moveet-ui:latest
    ports:
      - "5012:8080"
    # No environment block: the UI is a static SPA (built by Vite, served by
    # Caddy). VITE_API_URL / VITE_WS_URL are baked into the bundle at image
    # BUILD time (see the `ui` target in the root Dockerfile — no build args, so
    # the defaults http://localhost:5010 / ws://localhost:5010 apply) and cannot be changed
    # via runtime env vars. The browser reaches the simulator through its
    # published host port 5010 above, so the baked defaults are correct here.

volumes:
  # The simulator's map library (MAPS_DIR).
  maps:
