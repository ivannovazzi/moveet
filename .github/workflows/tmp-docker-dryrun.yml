name: tmp-docker-dryrun
on:
  pull_request:
    paths: ['.github/workflows/tmp-docker-dryrun.yml']
jobs:
  docker-build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [moveet-simulator, moveet-adapter, moveet-ui]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: moveet-simulator
            target: simulator
          - image: moveet-adapter
            target: adapter
          - image: moveet-ui
            target: ui
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
